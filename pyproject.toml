[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-kv-cache"
version = "0.1.0"
description = "Lock-free concurrent rope for KV cache indexing (Bw-tree indirection over a persistent vector)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gerald Enrique Nelson Mc Kenzie", email = "lordxmen2k@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
hf = ["transformers>=4.40", "torch>=2.0"]
bench = ["pytest-benchmark>=4"]

[project.urls]
Repository = "https://github.com/lordxmen2k/persistent-rope-kv-cache"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
